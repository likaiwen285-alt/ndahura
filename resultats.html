<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCLAMATION</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    html{
        --var-bg-color:#7743e9;
        --var-secondary-color:#6e51cf;
        --var-fond-color:#333;
        --var-bg-dark:#d3c9f3;
        --var-bg-light:#f0f4ff;
    }
    body{
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', sans-serif;
        background-color: var(--var-bg-light);
    }
    header{
        height: 4rem;
        background-color: #fff;
        padding: 0 2rem;  
        text-align: center;   
        display: flex;
        justify-content: space-between;
        align-items: center;        
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        position: sticky;
        top: 0;
    }
    header nav {
        display: flex;
        gap: 10rem;
        
    }
    header nav a button{
        border: none;
        background:linear-gradient(190deg, var(--var-bg-color) , var(--var-bg-light )) ;
        padding: 0.6rem;
        border-radius: 7px;
        font-size: 0.8rem;
        font-weight: 900;
        cursor: pointer;
    }
   header nav a button:hover{
        background-color: white;
        color: aqua;
    }
    main{
        padding: 2rem;
    }
    #logo{
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 2rem;
        position: relative;
        
    }
    #logo img{
        border-radius: 50px;
        z-index: 100;
    }
    #text{
        text-align: center;
        margin-top: 5rem;
        background-color: var(--var-bg-color);
        border-radius: 7px;
    }
    

</style>
<body>
   <header>
    <nav>
       
        <a href="index(0).html"><button><- Retour</button></a> 
        <h2>4 ème HP</h2>
    </nav>
   </header>
   <main>
    <section id="logo">
        <img src="logo ken.jpg" alt="logo indisponible" width="400px"/>
       
    </section>
    <section id="text">
       <i>   <H1>ANNEE 2026-2027</H1>
        <h2>RESULTAT INDISPONIBLE POUR LE MOMENT</h2>
        <br>
        <H3>1ère PERIODE EN COURS....... </h3></i>
    </section>
   </main> 
</body>
</html>
